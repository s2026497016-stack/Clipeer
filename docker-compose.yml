# Clipeer on one server: the app, PostgreSQL, and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# A server of its own: also set COMPOSE_PROFILES=own-https in .env. A shared server: see deploy/nginx-clipeer.conf.
services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    mem_limit: ${CLIPEER_DB_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipeer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clipeer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipeer"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipeer:${POSTGRES_PASSWORD}@db:5432/clipeer
      CLIPEER_PUBLIC_URL: https://${CLIPEER_DOMAIN:?set CLIPEER_DOMAIN in .env}
      # On a server everyone signs in. Set CLIPEER_ACCOUNTS=0 in .env only if the site is private to you.
      CLIPEER_ACCOUNTS: ${CLIPEER_ACCOUNTS:-1}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ./.git:/app/.git:ro            # only to tell which version is running, for the update notice
    # Reachable from this server only. On a server that already has a web server, point that one at this port
    # (see deploy/nginx-clipeer.conf). With the "own-https" profile, Caddy below is the web server instead.
    ports: ["127.0.0.1:${CLIPEER_BIND_PORT:-8765}:8765"]
    # On a server shared with other apps, these keep Clipeer inside its own share (all unlimited by default):
    # a memory ceiling with no swap, a processor ceiling, a lower turn at the processor when the server is busy,
    # and "stop this one first" if the whole server ever runs out of memory.
    mem_limit: ${CLIPEER_MEM_LIMIT:-0}
    memswap_limit: ${CLIPEER_MEM_LIMIT:-0}
    cpus: ${CLIPEER_CPUS:-0}
    cpu_shares: ${CLIPEER_CPU_SHARES:-1024}
    oom_score_adj: ${CLIPEER_OOM_SCORE_ADJ:-0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Only on a server Clipeer has to itself: add COMPOSE_PROFILES=own-https to .env and Caddy handles HTTPS.
  caddy:
    profiles: ["own-https"]
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      CLIPEER_DOMAIN: ${CLIPEER_DOMAIN}
    volumes:
      # Caddyfile fetches certificates by itself; Caddyfile.origin uses a Cloudflare origin certificate from ./secrets
      - ./deploy/${CLIPEER_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
